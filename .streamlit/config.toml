# Sistema visual nativo do OpenAlex Review (entrega UX-02).
# Fonte única de verdade visual: sem CSS global injetado na aplicação.
# Ver docs/ux-guidelines.md para as regras que este arquivo implementa.

[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1B1F24"
font = "sans serif"
